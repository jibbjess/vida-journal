<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vida Retailer Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a warm rep's notebook for shop owners — friendly, quick, product-first
   IDEA: a line sheet / lookbook spread on a sandy table, one post per rep email
   PICTURE: a stack of folded striped swatches (coral, blue, sage) beside the real flat-lay photo
   COLOUR and TYPE: sand ground, ink text, coral accent, ocean blue support; night = moonlit navy. Jost light titles + Nunito Sans
   LAYOUT: masthead with swatches, filter row, post cards; a post opens as a full lookbook page via #hash */
:root{color-scheme:light dark;
 --bg:light-dark(#f4efe3,#0f1a2b);--paper:light-dark(#fbf8f1,#16243a);--ink:light-dark(#1b1b1b,#ece6d6);
 --soft:light-dark(#5d584d,#a9b3c4);--line:light-dark(#ddd4c0,#26364f);
 --coral:light-dark(#e2604f,#f08a78);--blue:light-dark(#4f7fc0,#86aee6);--sage:light-dark(#9db89a,#a9c7a5);--sun:#f0c454}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:Jost,"Nunito Sans",sans-serif;font-weight:300;line-height:1.05;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(5vw,16px)}
header.mast{border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap;font-size:14px}
.top a{text-decoration:none;font-weight:700}
.top em{color:var(--soft)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(24px,4vw,56px) 0}
.hero h1{font-size:clamp(36px,6vw,58px)}
.hero p{color:var(--soft);max-width:52ch;margin:16px 0 0;font-size:17px}
.swatch{width:100%;height:auto;display:block;max-height:340px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:18px 0}
.chip{font:600 15px "Nunito Sans",sans-serif;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{margin-left:auto;font:16px "Nunito Sans",sans-serif;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:min(280px,100%)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px;padding-bottom:56px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:376/296;object-fit:cover;display:block}
.card .in{padding:18px 20px 22px;display:grid;gap:8px}
.meta{font-size:14px;color:var(--soft)}
.card h2{font-size:28px}
.card p{margin:0;color:var(--soft)}
.empty{padding:40px 0;color:var(--soft)}
/* post */
.post{padding-top:28px;padding-bottom:64px}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none}
.post .dek{font-style:italic;color:var(--soft);margin:18px 0 6px}
.post h1{font-size:clamp(36px,6vw,52px)}
.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:28px;align-items:start}
.photo{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px}
.photo img{width:100%;display:block;border-radius:3px}
.photo figcaption{font-size:14px;color:var(--soft);padding:8px 4px 2px}
.body h2{font-size:32px;margin:32px 0 10px}
.body h2:first-child{margin-top:0}
.body p{margin:0 0 14px;max-width:62ch;font-size:17px}
.stat{display:flex;gap:16px;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:22px 0}
.stat b{font:300 clamp(44px,7vw,64px)/1 Jost,sans-serif;color:var(--coral)}
.quote{margin:28px 0;padding:22px 24px;background:var(--paper);border-radius:6px;border:1px solid var(--line)}
.quote p{font:300 24px/1.3 Jost,sans-serif;margin:0 0 10px}
.quote p+p{color:var(--coral);margin:0}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:376/296;width:100%}
.swatches span{display:block}
.cols{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:12px 0 8px}
.cols li{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:15px}
.go{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:10px;background:var(--coral);color:#fff;border-radius:6px;font-weight:700;text-decoration:none}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin:14px 0 8px;padding:0;list-style:none}
.why li{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;font:400 20px/1.2 Jost,sans-serif}
.why li span{display:block;font:14px/1.4 "Nunito Sans",sans-serif;color:var(--soft);margin-top:6px}
.cta{margin-top:30px;background:var(--ink);color:var(--bg);border-radius:6px;padding:24px;display:grid;gap:8px}
.cta h3{font-size:28px}
.cta p{margin:0}
footer{border-top:1px solid var(--line);padding:28px 0 40px;font-size:15px;color:var(--soft)}
.team{display:flex;gap:28px;flex-wrap:wrap}
.team b{color:var(--ink);display:block}
@media(max-width:760px){.hero,.spread{grid-template-columns:minmax(0,1fr)}.search{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

function list(){
  const brands=['All',...new Set(POSTS.map(p=>p.brand))];
  if(!brands.includes(brand))brand='All';
  const s=q.trim().toLowerCase();
  const shown=POSTS.filter(p=>(brand==='All'||p.brand===brand)&&(!s||JSON.stringify(p).toLowerCase().includes(s)));
  app.innerHTML=`<div class="wrap">
   <section class="hero"><div><h1>New arrivals, best sellers and what's working on the floor</h1>
   <p>Every product email we send our shops, kept in one place. Come back any time to find a style, check what's in the catalog, or share a post with your buyer.</p></div>${swatches}</section>
   <div class="filters">${brands.map(b=>`<button class="chip" aria-pressed="${b===brand}" data-b="${esc(b)}">${esc(b)}</button>`).join('')}
   <input class="search" id="search" type="search" placeholder="Search styles, seasons…" aria-label="Search posts" value="${esc(q)}"></div>
   <div class="grid">${shown.map(p=>`<a class="card" href="#${p.id}">${pic(p)}<div class="in">
     <div class="meta">${esc(p.brand)} · ${esc(p.season)} · ${fmt(p.date)}</div><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p></div></a>`).join('')}</div>
   ${shown.length?'':'<p class="empty">No posts match that search yet.</p>'}</div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{brand=b.dataset.b;try{localStorage.setItem('vj-brand',brand)}catch(e){}list()});
  const si=document.getElementById('search');
  si.oninput=()=>{q=si.value;const pos=si.selectionStart;list();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)};
}

function pic(p){
  if(p.img&&IMG[p.img])return`<img src="${IMG[p.img]}" alt="${esc(p.caption)}">`;
  return`<div class="swatches" role="img" aria-label="${esc(p.caption)}">${['#4a2e3a','#e9e1cf','#1d1d1f','#3f5a8a','#b7c2a1','#c98a8a','#9db3d6','#b0402f','#f2e7a8','#d9a7b8'].map(c=>`<span style="background:${c}"></span>`).join('')}</div>`;
}
function block(b){
  if(b[0]==='h')return`<h2>${esc(b[1])}</h2>`;
  if(b[0]==='p')return`<p>${esc(b[1])}</p>`;
  if(b[0]==='stat')return`<div class="stat"><b>${esc(b[1])}</b><span>${esc(b[2])}</span></div>`;
  if(b[0]==='quote')return`<div class="quote"><p>${esc(b[1])}</p><p>${esc(b[2])}</p></div>`;
  if(b[0]==='colors')return`<h2>${esc(b[2]||'Colors in the line')}</h2><ul class="cols">${b[1].map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${''}`;
  if(b[0]==='why')return`<h2>Why it stands out</h2><ul class="why">${b[1].map(([t,d])=>`<li>${esc(t)}<span>${esc(d)}</span></li>`).join('')}</ul>`;
  return'';
}

function post(p){
  app.innerHTML=`<article class="wrap post"><a class="back" href="#">← All posts</a>
   <p class="dek">${esc(p.dek)}</p><h1>${esc(p.title)}</h1>
   <div class="meta" style="margin-top:10px">${esc(p.brand)} ${esc(p.category)} · ${esc(p.season)} · ${fmt(p.date)}</div>
   <div class="spread"><figure class="photo" style="margin:0">${pic(p)}<figcaption>${esc(p.caption)}</figcaption>${p.link?`<a class="go" href="${esc(p.link)}">${esc(p.linkLabel||'Open')} →</a>`:''}</figure>
   <div class="body">${p.blocks.map(block).join('')}
    ${p.link?`<p><a class="go" href="${esc(p.link)}">${esc(p.linkLabel)} →</a></p>`:''}<div class="cta"><h3>Ready to order all seasons?</h3><p>Reply to the email, call, or write to Jessica at jessica@vidaoutdoors.com and we'll get your order written.</p>
    <p><a href="mailto:jessica@vidaoutdoors.com?subject=${encodeURIComponent('Order: '+p.title)}">Email Jessica →</a></p></div>
   </div></div></article>`;
  window.scrollTo(0,0);
}

function route(){
  const id=location.hash.slice(1);
  const p=POSTS.find(x=>x.id===id);
  p?post(p):list();
  document.title=p?p.title+' · Vida Retailer Journal':'Vida Retailer Journal';
}
window.addEventListener('hashchange',route);
route();
}
</script>
</body>
</html>
